[package]
name = "fennec"
version = "0.1.0"
edition = "2024"
description = "Local Danish dictation and transcription"
license = "MIT"

[features]
default = []
# GPU backends for whisper.cpp. Vulkan covers AMD, Intel and NVIDIA; CUDA is NVIDIA only.
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
anyhow = "1"
async-channel = "2.5.0"
cairo-rs = { version = "0.22", features = ["pdf", "png"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
crossbeam-channel = "0.5.17"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
hound = "3.5"
pango = "0.22"
pangocairo = "0.22"
keyring = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }
rubato = "5.0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }
tempfile = "3"
thiserror = "2"
toml = "1.1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# Receiving recordings from the phone app (src/sync).
base64 = "0.22"
getrandom = "0.3"
httparse = "1"
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"

[dev-dependencies]
x509-parser = "0.18"

[profile.release]
strip = true

# whisper.cpp is unusably slow unoptimised, so optimise dependencies in dev builds too.
[profile.dev.package."*"]
opt-level = 3

[[test]]
name = "ui"
harness = false

# The real window, model and microphone, timed (FENNEC_RESPONSIVENESS=1).
[[test]]
name = "responsiveness"
harness = false

# The desktop half of the phone end-to-end test (FENNEC_PHONE_E2E_DIR;
# android/e2e/run-e2e.sh runs it).
[[test]]
name = "phone_e2e"
harness = false

# Stages the mockup's content and screenshots it (FENNEC_MOCKUP_DIR).
[[test]]
name = "mockup"
path = "tests/mockup/main.rs"
harness = false

[build-dependencies]
glib-build-tools = "0.22"
