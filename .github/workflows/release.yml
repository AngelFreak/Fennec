# Builds the Debian package and, for a version tag (v0.1.0), publishes it
# as a GitHub release. Built on Ubuntu 24.04, the oldest release Fennec
# supports, so the package installs there and on anything newer.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# One package for every computer: the Vulkan build uses the GPU (AMD, Intel
# or NVIDIA) when there is one and the CPU otherwise, which the engine test
# below checks on GitHub's GPU-less machines before anything is published.
#
# The tag must match the version in Cargo.toml. Pull requests that change
# the packaging build the package (kept as a workflow artifact) without
# releasing anything; "Run workflow" does the same by hand.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-deb.sh
      - android/app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libasound2-dev cmake clang dpkg-dev \
            glslc libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Build the package
        env:
          FEATURES: vulkan
        run: |
          deb=$(scripts/build-deb.sh | tail -n1)
          dpkg-deb --info "$deb"
          echo "DEB=$deb" >> "$GITHUB_ENV"

      - name: Check it transcribes without a GPU
        run: |
          mkdir -p tests/fixtures/models
          curl -sSfL -o tests/fixtures/models/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          cargo test --release --locked --features vulkan --test engine -- --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: ${{ env.DEB }}
          if-no-files-found: error

  # Fennec Recorder, the Android companion app. Signed when the repository
  # has the FENNEC_KEYSTORE_BASE64, FENNEC_KEYSTORE_PASSWORD, FENNEC_KEY_ALIAS
  # and FENNEC_KEY_PASSWORD secrets; an unsigned APK is kept as an artifact
  # but not published, since phones will not install it.
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version} in android/app/build.gradle.kts"
            exit 1
          fi

      - name: Test and build
        env:
          KEYSTORE_BASE64: ${{ secrets.FENNEC_KEYSTORE_BASE64 }}
          FENNEC_KEYSTORE_PASSWORD: ${{ secrets.FENNEC_KEYSTORE_PASSWORD }}
          FENNEC_KEY_ALIAS: ${{ secrets.FENNEC_KEY_ALIAS }}
          FENNEC_KEY_PASSWORD: ${{ secrets.FENNEC_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fennec.keystore"
            export FENNEC_KEYSTORE="$RUNNER_TEMP/fennec.keystore"
          fi
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/fennec-recorder-$version.apk"
          else
            echo "::warning::No signing key in the repository secrets: the APK is unsigned and will not be published."
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/fennec-recorder-$version-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/fennec-recorder-*.apk
          if-no-files-found: error

  release:
    needs: [deb, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Keep only a signed APK
        run: |
          shopt -s nullglob
          for f in apk/*.apk; do [[ "$f" == *-unsigned.apk ]] || mv "$f" dist/; done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=$(cat <<'EOF'
          Install on Ubuntu 24.04 or newer (or Debian with GTK 4.14+ and libadwaita 1.5+):

              sudo apt install ./fennec_*.deb

          The speech model runs on the GPU through Vulkan (AMD, Intel and NVIDIA) when there is one, and on the CPU otherwise. Settings → Speech model → Compute shows which, and can force the CPU.

          Fennec Recorder (`fennec-recorder-*.apk`, Android 10 or newer) records on your phone and sends the audio to Fennec over your own network. Install the APK, then in Fennec choose Settings → Phone → Pair a phone and scan the code.
          EOF
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Fennec ${GITHUB_REF_NAME#v}" --notes "$notes" --generate-notes
          fi
